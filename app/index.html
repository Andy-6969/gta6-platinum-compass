<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platinum Compass · GTA VI trophy guide &amp; tracker</title>
<meta name="description" content="Offline guide and tracker for the 55 PlayStation 5 trophies of Grand Theft Auto VI, with a cited roadmap and missable windows.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/parts.css">
<link rel="modulepreload" href="js/main.js">
</head>
<body>
<header id="top-bar" class="top-bar">
  <a id="brand" class="brand" href="#/tracker" aria-label="Platinum Compass home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 4.5l4 11.5-4 11.5-4-11.5z" class="needle"/><circle cx="16" cy="16" r="2.2" fill="currentColor"/></svg>
    <span class="brand-name">Platinum Compass</span>
    <span class="brand-game">GTA VI · PS5</span>
  </a>
  <nav id="view-tabs" class="view-tabs" aria-label="Views">
    <a href="#/tracker" data-view="tracker">Tracker</a>
    <a href="#/roadmap" data-view="roadmap">Roadmap</a>
    <a href="#/missables" data-view="missables">Missables</a>
    <a href="#/sources" data-view="sources">Sources</a>
  </nav>
  <div id="save-controls" class="save-controls">
    <button id="spoiler-toggle" type="button" class="toggle" aria-pressed="true"></button>
    <button id="export-progress" type="button">Export</button>
    <button id="import-progress" type="button">Import</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <span id="save-status" class="save-status" role="status"></span>
  </div>
</header>
<div id="status-strip" class="status-strip">
  <section id="progress-summary" class="progress-summary" aria-live="polite"></section>
  <section id="audit-strip" class="audit-strip" aria-label="Data audit, computed from the data files"></section>
</div>
<main id="view-root" class="view-root">
  <p class="boot-note">Loading the trophy data…</p>
</main>
<dialog id="import-dialog" class="import-dialog">
  <form method="dialog">
    <h2 id="import-dialog-title">Import progress</h2>
    <p id="import-dialog-text"></p>
    <menu><button value="cancel" type="submit">Cancel</button><button id="import-confirm" value="replace" type="submit" class="primary">Replace my progress</button></menu>
  </form>
</dialog>
<div id="toast" class="toast" role="alert" hidden></div>
<noscript><p class="boot-note">Platinum Compass needs JavaScript to show the checklist.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
